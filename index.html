<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wahat Al Khair Fruits & Vegetables</title>

<link rel="stylesheet" href="style.css">

<div class="category">

🌿

© 2026 Wahat Al Khair Fruits & Vegetables
